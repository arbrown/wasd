{{ define "main" }}
<div class="list-header">
  <h1 class="page-title">
    {{ if eq .Kind "term" }}
      {{ .Data.Singular | humanize }}: {{ .Title }}
    {{ else }}
      {{ .Title }}
    {{ end }}
  </h1>
  {{ with .Description }}
    <p class="page-subtitle">{{ . }}</p>
  {{ end }}
</div>

<div class="posts-list">
  {{ range .Paginator.Pages }}
    {{ partial "post-card.html" . }}
  {{ end }}
</div>

{{ template "_internal/pagination.html" . }}
{{ end }}
